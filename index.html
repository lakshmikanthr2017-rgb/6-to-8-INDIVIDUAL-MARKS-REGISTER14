<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>6-8 Individual Marks Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header class="header">

        <h1>
            6 ರಿಂದ 8 ನೇ ತರಗತಿಯ ವಿದ್ಯಾರ್ಥಿಗಳ
            ಅಂಕ ನಮೂದು ವಹಿ
        </h1>

        <p>
            Teacher Individual Marks Register
        </p>

    </header>


    <!-- SETTINGS -->

    <section class="settings">

        <div class="form-group">

            <label for="classSelect">
                Class
            </label>

            <select id="classSelect">

                <option value="6ನೇ ತರಗತಿ">
                    6ನೇ ತರಗತಿ
                </option>

                <option value="7ನೇ ತರಗತಿ">
                    7ನೇ ತರಗತಿ
                </option>

                <option value="8ನೇ ತರಗತಿ">
                    8ನೇ ತರಗತಿ
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="subjectSelect">
                Subject
            </label>

            <select id="subjectSelect">

                <option value="Kannada">
                    Kannada
                </option>

                <option value="English">
                    English
                </option>

                <option value="Hindi">
                    Hindi
                </option>

                <option value="Mathematics">
                    Mathematics
                </option>

                <option value="Science">
                    Science
                </option>

                <option value="Social Science">
                    Social Science
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="yearSelect">
                Academic Year
            </label>

            <select id="yearSelect">

                <option value="2026-27">
                    2026-27
                </option>

                <option value="2025-26">
                    2025-26
                </option>

                <option value="2024-25">
                    2024-25
                </option>

            </select>

        </div>

    </section>


    <!-- MARKS TABLE -->

    <section class="table-section">

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th rowspan="2">
                            Sl.No
                        </th>

                        <th rowspan="2">
                            Student Name
                        </th>

                        <th colspan="6">
                            Assessment
                        </th>

                        <th rowspan="2">
                            Total
                        </th>

                        <th rowspan="2">
                            Grade
                        </th>

                    </tr>

                    <tr>

                        <th>FA-1</th>

                        <th>FA-2</th>

                        <th>SA-1</th>

                        <th>FA-3</th>

                        <th>FA-4</th>

                        <th>SA-2</th>

                    </tr>

                </thead>


                <tbody id="studentBody">
                    <!-- Rows are created by script.js -->
                </tbody>

            </table>

        </div>

    </section>


    <!-- BUTTONS -->

    <section class="buttons">

        <button
            id="saveBtn"
            class="btn save-btn"
            type="button"
        >
            💾 Save Register
        </button>


        <button
            id="printBtn"
            class="btn print-btn"
            type="button"
        >
            🖨 Print Report
        </button>


        <button
            id="resetBtn"
            class="btn reset-btn"
            type="button"
        >
            ↻ Reset
        </button>

    </section>


    <footer>

        <p>
            Teacher Individual Marks Register
        </p>

    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
